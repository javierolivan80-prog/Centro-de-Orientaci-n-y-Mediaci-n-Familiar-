<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banner | Centro de Orientación y Mediación Familiar</title>
  <!--
    Fuente de los banners. Se elige estilo y tamaño por la URL:
      banner.html?style=organic|editorial|sun&size=og|square|cover
    Los PNG se generan con: node scripts/export-banners.js
    Todo el texto está en HTML/CSS (editable); las formas son CSS/SVG, sin imágenes externas.
    Misma paleta y tipografías que la web: «la luz del día».
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,500..600,100;1,9..144,500,100&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #FFFCF5;
      --cream: #FBF1DD;
      --butter: #F7E3B8;
      --sun: #F7C65B;
      --leaf: #2A7550;
      --green: #5BA17A;
      --pine: #123D2E;
      --clay: #B94A2C;
      --ink: #1E2A24;
      --muted: #4F5F55;
      --serif: "Fraunces", Georgia, serif;
      --sans: "Figtree", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; background: #d9d4cb; }

    /* ---------- Tamaños exactos de plataforma ---------- */
    .banner {
      position: relative;
      width: var(--w);
      height: var(--h);
      overflow: hidden;
      font-family: var(--sans);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .size-og     { --w: 1200px; --h: 630px;  --px: 108px; --py: 72px; --h1: 64px; --kicker: 18px; --sub: 22px; --cta-h: 56px; --cta-fs: 18px; --maxw: 62%; }
    .size-square { --w: 1080px; --h: 1080px; --px: 120px; --py: 120px; --h1: 90px; --kicker: 22px; --sub: 28px; --cta-h: 66px; --cta-fs: 22px; --maxw: 100%; }
    .size-cover  { --w: 820px;  --h: 312px;  --px: 64px;  --py: 40px;  --h1: 34px; --kicker: 16px; --sub: 16px; --cta-h: 44px; --cta-fs: 16px; --maxw: 58%; }

    /* ---------- Contenido (siempre dentro de la zona segura) ---------- */
    .content {
      position: absolute;
      inset: var(--py) var(--px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 2;
    }

    /* Firma del centro abajo a la izquierda, a la altura del botón (no va sobre el titular) */
    .kicker {
      position: absolute;
      left: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      min-height: var(--cta-h);
      max-width: 46%;
      line-height: 1.35;
      margin: 0;
      font-size: var(--kicker);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--pine);
    }

    h1 {
      max-width: var(--maxw);
      margin: 0;
      font-family: var(--serif);
      font-variation-settings: "SOFT" 100;
      font-weight: 520;
      font-size: var(--h1);
      line-height: 1.04;
      letter-spacing: -0.022em;
      color: var(--pine);
      text-wrap: balance;
    }

    h1 em { font-style: italic; font-weight: 500; color: var(--clay); }

    .sub {
      max-width: var(--maxw);
      margin: 1.1em 0 0;
      font-size: var(--sub);
      line-height: 1.5;
      color: var(--ink);
    }

    .cta {
      position: absolute;
      right: 0;
      bottom: 0;
      display: inline-flex;
      align-items: center;
      height: var(--cta-h);
      padding: 0 1.7em;
      border-radius: 999px;
      background: var(--clay);
      color: #fff;
      font-size: var(--cta-fs);
      font-weight: 700;
      white-space: nowrap;
    }

    .size-cover .sub { display: none; }
    .size-cover .kicker { display: none; } /* Facebook ya muestra el nombre de la página junto a la portada */

    .art { position: absolute; inset: 0; z-index: 1; display: none; }

    /* =====================================================================
       Dirección 1 · Natural / orgánica: ramas verdes y un sol sobre crema
       ===================================================================== */
    .style-organic { background: linear-gradient(160deg, var(--paper) 0%, var(--cream) 100%); }
    .style-organic .art-organic { display: block; }
    .art-organic svg { position: absolute; right: -2%; top: 0; height: 100%; width: 54%; }
    .size-square.style-organic .art-organic svg {
      width: 100%; height: 40%; top: auto; bottom: -2%; right: 0;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 30%);
      mask-image: linear-gradient(to bottom, transparent 0, #000 30%);
    }
    .size-cover.style-organic .art-organic svg { width: 38%; }
    .size-square.style-organic .content { justify-content: flex-start; padding-top: 20px; }
    .size-square.style-organic h1 { max-width: 82%; }
    .size-square.style-organic .sub { max-width: 64%; }
    .size-square.style-organic .cta { bottom: 20px; }
    .size-square.style-organic .kicker { bottom: 20px; }

    /* =====================================================================
       Dirección 2 · Editorial: banda de pino, filetes y titular protagonista
       ===================================================================== */
    .style-editorial { background: var(--cream); }
    .style-editorial .art-editorial { display: block; }
    .art-editorial .band { position: absolute; left: 0; top: 0; bottom: 0; width: 17%; background: var(--pine); }
    .art-editorial .mark { position: absolute; left: 50%; top: 50%; width: 52%; aspect-ratio: 1.45; transform: translate(-50%, -50%); }
    .art-editorial .mark i { position: absolute; top: 0; bottom: 0; width: 69%; border-radius: 50%; mix-blend-mode: screen; }
    .art-editorial .mark i:first-child { left: 0; background: #2F8F63; }
    .art-editorial .mark i:last-child { right: 0; background: #E0A93B; }
    .art-editorial .rule { position: absolute; left: 17%; right: 0; top: 0; height: 8px; background: var(--sun); }

    .style-editorial .content { left: calc(17% + var(--px) * 0.55); right: var(--px); }
    .style-editorial h1 { max-width: 100%; }
    .size-og.style-editorial h1 { font-size: 58px; }
    .style-editorial .sub { max-width: 80%; }
    .size-square.style-editorial .art-editorial .band { width: 14%; }
    .size-square.style-editorial .rule { left: 14%; }
    .size-square.style-editorial .content { left: calc(14% + 80px); right: 100px; justify-content: center; }
    .size-cover.style-editorial .art-editorial .band { width: 15%; }
    .size-cover.style-editorial .rule { left: 15%; height: 6px; }
    .size-cover.style-editorial .content { left: calc(15% + 36px); right: 48px; }
    .size-cover.style-editorial h1 { max-width: 62%; }

    /* =====================================================================
       Dirección 3 · Sol: un sol grande sobre colinas verdes
       ===================================================================== */
    .style-sun { background: linear-gradient(180deg, #CDE8F0 0%, #FFF3D6 62%, var(--cream) 100%); }
    .style-sun .art-sun { display: block; }
    .art-sun .disc {
      position: absolute; right: 8%; top: 12%; width: 36%; aspect-ratio: 1; border-radius: 50%;
      background: radial-gradient(circle, #FFD66B 0 50%, rgba(255, 214, 107, 0.55) 62%, rgba(255, 214, 107, 0) 76%);
    }
    .art-sun .core { position: absolute; right: 13.5%; top: 21%; width: 25%; aspect-ratio: 1; border-radius: 50%; background: var(--sun); }
    .art-sun svg { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 36%; }
    .size-square .art-sun .disc { top: auto; bottom: 24%; right: 4%; width: 54%; }
    .size-square .art-sun .core { top: auto; bottom: 33%; right: 11.5%; width: 39%; }
    .size-square .art-sun svg { height: 30%; }
    .size-cover .art-sun .disc { width: 50%; right: -4%; top: -6%; }
    .size-cover .art-sun .core { width: 34%; right: 4%; top: 4%; }
    .size-cover .art-sun svg { height: 34%; }
    .style-sun h1, .style-sun .sub { text-shadow: 0 0 22px rgba(255, 252, 245, 0.85); }
    .size-square.style-sun .content { justify-content: flex-start; padding-top: 20px; }
    .size-square.style-sun h1 { max-width: 86%; }
    .size-square.style-sun .sub { max-width: 66%; }
    .size-square.style-sun .cta, .size-square.style-sun .kicker { bottom: 20px; }
    .style-sun .kicker { padding: 0 1.3em; border-radius: 999px; background: var(--paper); color: var(--pine); } /* pastilla clara: contraste asegurado sobre las colinas */
    .style-sun .cta { box-shadow: 0 6px 0 rgba(0, 0, 0, 0.12); }
  </style>
</head>
<body>
  <div id="banner" class="banner style-organic size-og">

    <!-- Arte: solo CSS / SVG -->
    <div class="art art-organic" aria-hidden="true">
      <svg viewBox="0 0 520 630" preserveAspectRatio="xMaxYMid slice">
        <defs>
          <path id="leaf" d="M0 0 C 26 -46 86 -46 112 0 C 86 46 26 46 0 0 Z"/>
          <radialGradient id="sg"><stop offset="0" stop-color="#FFD66B"/><stop offset=".6" stop-color="#FFD66B" stop-opacity=".5"/><stop offset="1" stop-color="#FFD66B" stop-opacity="0"/></radialGradient>
        </defs>
        <circle cx="400" cy="150" r="230" fill="url(#sg)"/>
        <circle cx="400" cy="150" r="120" fill="#F7C65B"/>
        <path d="M470 640 C 440 470 360 330 250 190" fill="none" stroke="#2A7550" stroke-width="4" stroke-linecap="round"/>
        <g>
          <use href="#leaf" transform="translate(448 520) rotate(-135) scale(1.05)" fill="#5BA17A"/>
          <use href="#leaf" transform="translate(432 470) rotate(-20) scale(1.1)" fill="#2A7550"/>
          <use href="#leaf" transform="translate(410 410) rotate(-150) scale(1.0)" fill="#7FBF95"/>
          <use href="#leaf" transform="translate(386 370) rotate(-30) scale(1.0)" fill="#3F8C63"/>
          <use href="#leaf" transform="translate(352 318) rotate(-155) scale(0.95)" fill="#5BA17A"/>
          <use href="#leaf" transform="translate(326 284) rotate(-40) scale(0.9)" fill="#123D2E"/>
          <use href="#leaf" transform="translate(292 238) rotate(-160) scale(0.85)" fill="#7FBF95"/>
          <use href="#leaf" transform="translate(268 210) rotate(-55) scale(0.8)" fill="#2A7550"/>
          <use href="#leaf" transform="translate(250 190) rotate(-95) scale(0.75)" fill="#5BA17A"/>
        </g>
      </svg>
    </div>

    <div class="art art-editorial" aria-hidden="true">
      <div class="band"><span class="mark"><i></i><i></i></span></div>
      <div class="rule"></div>
    </div>

    <div class="art art-sun" aria-hidden="true">
      <span class="disc"></span>
      <span class="core"></span>
      <svg viewBox="0 0 600 200" preserveAspectRatio="none">
        <path d="M0 80C120 40 240 70 360 90S520 70 600 40V200H0z" fill="#A9D2B4"/>
        <path d="M0 120C140 80 260 110 380 124S530 110 600 90V200H0z" fill="#5BA17A"/>
        <path d="M0 160C160 126 280 150 400 160S540 150 600 138V200H0z" fill="#2A7550"/>
      </svg>
    </div>

    <!-- Texto: HTML real, editable -->
    <div class="content">
      <p class="kicker">Orientación y mediación familiar</p>
      <h1>Cuidar las relaciones es cuidar <em>lo que más importa</em></h1>
      <p class="sub">Un espacio de escucha para comprender las dificultades, recuperar el diálogo y encontrar caminos de entendimiento.</p>
      <span class="cta">Solicita tu primera consulta</span>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(location.search);
    var style = ["organic", "editorial", "sun"].includes(params.get("style")) ? params.get("style") : "organic";
    var size = ["og", "square", "cover"].includes(params.get("size")) ? params.get("size") : "og";
    document.getElementById("banner").className = "banner style-" + style + " size-" + size;
  </script>
</body>
</html>
