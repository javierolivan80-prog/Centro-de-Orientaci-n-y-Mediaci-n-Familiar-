<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banner | Centro de Orientación y Mediación Familiar</title>
  <!--
    Fuente de los banners. Se elige estilo y tamaño por la URL:
      banner.html?style=organic|editorial|gradient&size=og|square|cover
    Los PNG se generan con: node scripts/export-banners.js
    Todo el texto está en HTML/CSS (editable); las formas son CSS/SVG, sin imágenes externas.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ivory: #FBF8F2;
      --off-white: #F5EFE4;
      --beige: #EDE3D3;
      --sand: #E3D6C2;
      --sage: #8C9B7E;
      --olive: #5C6B4E;
      --olive-dark: #4A5740;
      --ink: #3A332D;
      --taupe: #6E6055;
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Manrope", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; background: #d9d4cb; }

    /* ---------- Tamaños exactos de plataforma ---------- */
    .banner {
      position: relative;
      width: var(--w);
      height: var(--h);
      overflow: hidden;
      font-family: var(--sans);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .size-og     { --w: 1200px; --h: 630px;  --px: 108px; --py: 72px; --h1: 66px; --kicker: 18px; --sub: 22px; --cta-h: 54px; --cta-fs: 18px; --maxw: 62%; }
    .size-square { --w: 1080px; --h: 1080px; --px: 120px; --py: 120px; --h1: 92px; --kicker: 22px; --sub: 28px; --cta-h: 64px; --cta-fs: 22px; --maxw: 100%; }
    .size-cover  { --w: 820px;  --h: 312px;  --px: 64px;  --py: 40px;  --h1: 34px; --kicker: 16px; --sub: 16px; --cta-h: 44px; --cta-fs: 16px; --maxw: 58%; }

    /* ---------- Contenido (siempre dentro de la zona segura) ---------- */
    .content {
      position: absolute;
      inset: var(--py) var(--px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 2;
    }

    /* Firma del centro abajo a la izquierda, a la altura del botón (no va sobre el titular) */
    .kicker {
      position: absolute;
      left: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      min-height: var(--cta-h);
      max-width: 46%;
      line-height: 1.35;
      margin: 0;
      font-size: var(--kicker);
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--olive-dark);
    }

    h1 {
      max-width: var(--maxw);
      margin: 0;
      font-family: var(--serif);
      font-weight: 500;
      font-size: var(--h1);
      line-height: 1.06;
      letter-spacing: -0.012em;
      text-wrap: balance;
    }

    h1 em { font-style: italic; color: var(--olive-dark); }

    .sub {
      max-width: var(--maxw);
      margin: 1.1em 0 0;
      font-size: var(--sub);
      line-height: 1.5;
      color: var(--taupe);
    }

    .cta {
      position: absolute;
      right: 0;
      bottom: 0;
      display: inline-flex;
      align-items: center;
      height: var(--cta-h);
      padding: 0 1.7em;
      border-radius: 999px;
      background: var(--olive);
      color: var(--ivory);
      font-size: var(--cta-fs);
      font-weight: 600;
      white-space: nowrap;
    }

    .size-cover .sub { display: none; }
    .size-cover .kicker { display: none; } /* Facebook ya muestra el nombre de la página junto a la portada */
    .size-cover .cta { right: 0; bottom: 0; }

    .art { position: absolute; inset: 0; z-index: 1; display: none; }

    /* =====================================================================
       Dirección 1 · Natural / orgánica
       Ramas y hojas en verdes salvia y oliva sobre marfil
       ===================================================================== */
    .style-organic { background: linear-gradient(160deg, var(--ivory) 0%, var(--off-white) 100%); }
    .style-organic .art-organic { display: block; }
    .art-organic svg { position: absolute; right: -2%; top: 0; height: 100%; width: 54%; }
    .size-square.style-organic .art-organic svg { width: 100%; height: 40%; top: auto; bottom: -2%; right: 0; 
      -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 30%);
      mask-image: linear-gradient(to bottom, transparent 0, #000 30%); }
    .size-cover.style-organic .art-organic svg { width: 38%; }

    .size-square.style-organic .content { justify-content: flex-start; padding-top: 20px; }
    .size-square.style-organic h1 { max-width: 82%; }
    .size-square.style-organic .sub { max-width: 64%; }
    .size-square.style-organic .cta { bottom: 20px; }

    /* =====================================================================
       Dirección 2 · Editorial
       Rejilla con filetes finos, banda lateral en oliva y titular protagonista
       ===================================================================== */
    .style-editorial { background: var(--off-white); }
    .style-editorial .art-editorial { display: block; }
    .art-editorial .band {
      position: absolute; left: 0; top: 0; bottom: 0; width: 17%;
      background: var(--olive);
    }
    .art-editorial .band::after {
      content: "";
      position: absolute; right: 0; top: 0; bottom: 0; width: 1px;
      background: rgba(251, 248, 242, 0.35);
    }
    .art-editorial .rule {
      position: absolute; left: 17%; right: 0; top: 0; height: 1px; background: var(--sand);
    }
    .art-editorial .rule.bottom { top: auto; bottom: 0; }
    .art-editorial .mark {
      position: absolute; left: 50%; top: 50%; width: 36%; aspect-ratio: 1;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(251, 248, 242, 0.5);
      border-radius: 50% 50% 50% 8%;
    }

    .style-editorial .content { left: calc(17% + var(--px) * 0.55); right: var(--px); }
    .style-editorial h1 { max-width: 100%; }
    .size-og.style-editorial h1 { font-size: 60px; }
    .style-editorial .sub { max-width: 80%; }
    .size-square.style-editorial .art-editorial .band { width: 14%; }
    .size-square.style-editorial .rule { left: 14%; }
    .size-square.style-editorial .content { left: calc(14% + 80px); right: 100px; justify-content: center; }
    .size-cover.style-editorial .art-editorial .band { width: 15%; }
    .size-cover.style-editorial .rule { left: 15%; }
    .size-cover.style-editorial .content { left: calc(15% + 36px); right: 48px; }
    .size-cover.style-editorial h1 { max-width: 62%; }

    /* =====================================================================
       Dirección 3 · Degradado suave / minimalista
       Mucho aire, un solo foco y manchas de color suaves
       ===================================================================== */
    .style-gradient {
      background:
        radial-gradient(60% 80% at 88% 8%, rgba(140, 155, 126, 0.55), transparent 62%),
        radial-gradient(55% 70% at 10% 105%, rgba(227, 214, 194, 0.95), transparent 60%),
        radial-gradient(40% 50% at 70% 90%, rgba(237, 227, 211, 0.9), transparent 70%),
        var(--ivory);
    }
    .style-gradient .art-gradient { display: block; }
    .art-gradient .ring {
      position: absolute; right: 5%; top: 50%;
      width: 30%; aspect-ratio: 1; transform: translateY(-50%);
      border: 1px solid rgba(74, 87, 64, 0.35);
      border-radius: 50%;
    }
    .art-gradient .ring.small { width: 19%; right: 10.5%; border-color: rgba(74, 87, 64, 0.25); }
    .size-square .art-gradient .ring { top: 86%; right: 4%; width: 44%; }
    .size-square .art-gradient .ring.small { width: 28%; right: 12%; }
    .size-cover .art-gradient .ring { width: 70%; right: -34%; }
    .size-cover .art-gradient .ring.small { width: 46%; right: -18%; }

    .size-square.style-gradient .content { justify-content: flex-start; padding-top: 30px; }
    .size-square.style-gradient h1 { max-width: 86%; }
    .size-square.style-gradient .cta { bottom: 20px; }
  </style>
</head>
<body>
  <div id="banner" class="banner style-organic size-og">

    <!-- Arte: solo CSS / SVG -->
    <div class="art art-organic" aria-hidden="true">
      <svg viewBox="0 0 520 630" preserveAspectRatio="xMaxYMid slice">
        <defs>
          <path id="leaf" d="M0 0 C 26 -46 86 -46 112 0 C 86 46 26 46 0 0 Z"/>
        </defs>
        <circle cx="400" cy="150" r="190" fill="#EDE3D3" opacity="0.8"/>
        <path d="M470 640 C 440 470 360 330 250 190" fill="none" stroke="#5C6B4E" stroke-width="3" stroke-linecap="round"/>
        <g fill="#8C9B7E">
          <use href="#leaf" transform="translate(448 520) rotate(-135) scale(1.05)" opacity="0.95"/>
          <use href="#leaf" transform="translate(432 470) rotate(-20) scale(1.1)" fill="#5C6B4E" opacity="0.9"/>
          <use href="#leaf" transform="translate(410 410) rotate(-150) scale(1.0)" opacity="0.85"/>
          <use href="#leaf" transform="translate(386 370) rotate(-30) scale(1.0)" fill="#5C6B4E" opacity="0.85"/>
          <use href="#leaf" transform="translate(352 318) rotate(-155) scale(0.95)" opacity="0.8"/>
          <use href="#leaf" transform="translate(326 284) rotate(-40) scale(0.9)" fill="#4A5740" opacity="0.8"/>
          <use href="#leaf" transform="translate(292 238) rotate(-160) scale(0.85)" opacity="0.75"/>
          <use href="#leaf" transform="translate(268 210) rotate(-55) scale(0.8)" fill="#5C6B4E" opacity="0.75"/>
          <use href="#leaf" transform="translate(250 190) rotate(-95) scale(0.75)" fill="#8C9B7E" opacity="0.7"/>
        </g>
      </svg>
    </div>

    <div class="art art-editorial" aria-hidden="true">
      <div class="band"><span class="mark"></span></div>
      <div class="rule"></div>
      <div class="rule bottom"></div>
    </div>

    <div class="art art-gradient" aria-hidden="true">
      <span class="ring"></span>
      <span class="ring small"></span>
    </div>

    <!-- Texto: HTML real, editable -->
    <div class="content">
      <p class="kicker">Orientación y mediación familiar</p>
      <h1>Cuidar las relaciones es cuidar <em>lo que más importa</em></h1>
      <p class="sub">Un espacio de escucha para comprender las dificultades, recuperar el diálogo y encontrar caminos de entendimiento.</p>
      <span class="cta">Solicita tu primera consulta</span>
    </div>
  </div>

  <script>
    var params = new URLSearchParams(location.search);
    var style = ["organic", "editorial", "gradient"].includes(params.get("style")) ? params.get("style") : "organic";
    var size = ["og", "square", "cover"].includes(params.get("size")) ? params.get("size") : "og";
    document.getElementById("banner").className = "banner style-" + style + " size-" + size;
  </script>
</body>
</html>
