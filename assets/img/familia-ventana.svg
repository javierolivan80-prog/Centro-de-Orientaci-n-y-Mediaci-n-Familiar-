    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFBF0" stop-opacity=".75"/><stop offset="1" stop-color="#FFFBF0" stop-opacity="0"/></linearGradient>
    <clipPath id="glass"><path d="M350 660V310a175 175 0 0 1 350 0v350z"/></clipPath>
  </defs>
  <rect width="800" height="1000" fill="url(#wall)"/>
