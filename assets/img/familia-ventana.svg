<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="t d">
  <style>
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite alternate}
.sway.b{animation-duration:7.5s;animation-delay:-2s}
@keyframes sway{from{transform:rotate(-2.6deg)}to{transform:rotate(2.6deg)}}
.grove{transform-box:fill-box;transform-origin:50% 100%;animation:grove 9s ease-in-out infinite alternate}
@keyframes grove{from{transform:rotate(-.5deg)}to{transform:rotate(.5deg)}}
.steam{transform-box:fill-box;animation:steam 3.4s ease-out infinite;opacity:0}
.steam.b{animation-delay:-1.7s}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}30%{opacity:.85}100%{opacity:0;transform:translateY(-20px)}}
.glow{transform-box:fill-box;transform-origin:50% 50%;animation:glow 6s ease-in-out infinite alternate}
@keyframes glow{from{transform:scale(1);opacity:.7}to{transform:scale(1.12);opacity:1}}
.light{animation:light 8s ease-in-out infinite alternate}
@keyframes light{from{opacity:.5}to{opacity:1}}
.nod{transform-box:fill-box;transform-origin:50% 100%;animation:nod 5s ease-in-out infinite alternate}
.nod.b{animation-duration:6.4s;animation-delay:-2.2s}
@keyframes nod{from{transform:rotate(-1.1deg)}to{transform:rotate(1.1deg)}}
.drift{animation:drift 26s ease-in-out infinite alternate}
.drift.b{animation-duration:34s;animation-delay:-9s}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(30px)}}
.bob{animation:bob 1.05s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.breathe{transform-box:fill-box;transform-origin:50% 0;animation:breathe 7s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scaleX(1)}to{transform:scaleX(1.03)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.steam{opacity:0}}
</style>
  <title id="t">Familia junto a una ventana</title>
  <desc id="d">Ilustración de dos adultos y un niño sentados juntos a una mesa, de espaldas a una ventana luminosa.</desc>
  <defs>
    <radialGradient id="sunglow"><stop offset="0" stop-color="#FFE08A" stop-opacity=".95"/><stop offset=".55" stop-color="#FFD66B" stop-opacity=".35"/><stop offset="1" stop-color="#FFD66B" stop-opacity="0"/></radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6e3"/><stop offset="1" stop-color="#f7e3b8"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cde8f0"/><stop offset="1" stop-color="#fff3d6"/></linearGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFBF0" stop-opacity=".75"/><stop offset="1" stop-color="#FFFBF0" stop-opacity="0"/></linearGradient>
    <clipPath id="glass"><path d="M350 660V310a175 175 0 0 1 350 0v350z"/></clipPath>
  </defs>
  <rect width="800" height="1000" fill="url(#wall)"/>
  <!-- ventana -->
  <path d="M330 680V310a195 195 0 0 1 390 0v370z" fill="#fffcf5"/>
  <path d="M350 660V310a175 175 0 0 1 350 0v350z" fill="url(#sky)"/>
  <g clip-path="url(#glass)">
    <circle class="glow" cx="610" cy="240" r="120" fill="url(#sunglow)" opacity="1"/>
    <circle cx="610" cy="240" r="62" fill="#F7C65B"/>
    <g class="drift"><ellipse cx="450" cy="190" rx="48" ry="14" fill="#fff" opacity=".85"/><ellipse cx="484" cy="178" rx="30" ry="12" fill="#fff" opacity=".85"/></g>
    <g class="drift b"><ellipse cx="640" cy="360" rx="40" ry="11" fill="#fff" opacity=".7"/></g>
    <path d="M330 520C400 470 470 480 540 510S660 500 720 470V680H330z" fill="#a9d2b4"/>
    <path d="M330 580C410 540 480 560 560 585S670 570 720 550V680H330z" fill="#5ba17a"/>
    <g fill="#2a7550"><rect x="420" y="540" width="7" height="50"/><ellipse cx="423" cy="535" rx="30" ry="24"/><rect x="620" y="552" width="6" height="42"/><ellipse cx="623" cy="548" rx="24" ry="19"/></g>
  </g>
  <path d="M525 150V660M350 430H700" stroke="#fffcf5" stroke-width="10" fill="none"/>
  <path d="M350 660V310a175 175 0 0 1 350 0v350z" fill="none" stroke="#fffcf5" stroke-width="14"/>
  <!-- haz de luz -->
  <path class="light" d="M350 680L40 1000H520L720 680z" fill="url(#beam)"/>
  <!-- planta de pie -->
  <g transform="translate(-60 40)">
    <path d="M72 600V470M72 560C40 540 20 500 30 470M72 540C100 520 118 480 108 450M72 500C50 480 46 450 56 428" stroke="#2a7550" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g class="sway" fill="#5ba17a"><ellipse cx="30" cy="462" rx="14" ry="26" transform="rotate(-20 30 462)"/><ellipse cx="108" cy="442" rx="14" ry="26" transform="rotate(22 108 442)"/><ellipse cx="56" cy="418" rx="13" ry="24"/></g>
    <path d="M40 600H104L96 700H48z" fill="#e2704a"/>
  </g>
  <!-- adulto izquierda -->
  <g class="nod">
    <rect x="232" y="500" width="34" height="60" fill="#e8b58c"/>
    <path d="M130 760C130 620 178 568 249 568S368 620 368 760z" fill="#2a7550"/>
    <circle cx="249" cy="470" r="60" fill="#f0c6a0"/>
    <path d="M190 470C186 410 230 396 262 402C300 410 316 444 306 484C296 440 262 430 226 440C206 446 196 456 190 470z" fill="#2a211c"/>
    <circle cx="206" cy="430" r="30" fill="#2a211c"/>
  </g>
  <!-- adulto derecha -->
  <g class="nod b">
    <rect x="570" y="505" width="38" height="66" fill="#C18654"/>
    <path d="M446 760C446 622 500 576 589 576S732 622 732 760z" fill="#F4A261"/>
    <circle cx="589" cy="476" r="62" fill="#d69a6b"/>
    <path d="M528 470C526 414 566 402 596 404C636 406 656 436 650 470C636 440 590 432 556 442C540 448 530 458 528 470z" fill="#2a211c"/>
  </g>
  <!-- niño -->
  <g class="nod b" style="animation-duration:4.2s">
    <rect x="404" y="600" width="26" height="40" fill="#E0B28E"/>
    <path d="M338 770C338 676 372 632 417 632S496 676 496 770z" fill="#e2704a"/>
    <circle cx="417" cy="574" r="46" fill="#f5d0ae"/>
    <path d="M372 570C370 530 396 520 420 524C446 528 462 548 458 576C448 552 420 546 394 552C384 556 376 562 372 570z" fill="#6b4a33"/>
  </g>
  <!-- brazos que abrazan al niño -->
  <path d="M338 668C372 676 394 690 408 712" stroke="#2a7550" stroke-width="40" stroke-linecap="round" fill="none"/>
  <path d="M500 676C468 682 444 696 430 716" stroke="#F4A261" stroke-width="40" stroke-linecap="round" fill="none"/>
  <!-- mesa -->
  <rect x="0" y="736" width="800" height="264" fill="#c98e57"/>
  <rect x="0" y="736" width="800" height="26" fill="#e3b07a"/>
  <rect x="0" y="762" width="800" height="10" fill="#a86f3a" opacity=".6"/>
  <g>
    <g class="steam"><path d="M128 700c-8-9 8-14 0-27" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></g><g class="steam b"><path d="M144 700c-8-9 8-14 0-27" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></g>
    <path d="M110 712h54l-5 28h-44z" fill="#fffcf5"/><path d="M164 722c14 0 14 16 0 16" stroke="#fffcf5" stroke-width="5" fill="none"/>
    <path d="M610 706h44l-4 34h-36z" fill="#fffcf5"/>
    <path d="M632 706c-14-24 6-44 4-60M632 706c14-20-2-38 18-58" stroke="#5ba17a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <g class="sway b"><ellipse cx="636" cy="650" rx="9" ry="16" fill="#5ba17a" transform="rotate(-16 636 650)"/><ellipse cx="654" cy="646" rx="9" ry="16" fill="#2a7550" transform="rotate(20 654 646)"/></g>
  </g>
</svg>
