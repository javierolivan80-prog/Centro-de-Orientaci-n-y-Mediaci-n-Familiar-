<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d">
  <style>
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out infinite alternate}
.sway.b{animation-duration:7.5s;animation-delay:-2s}
@keyframes sway{from{transform:rotate(-2.6deg)}to{transform:rotate(2.6deg)}}
.grove{transform-box:fill-box;transform-origin:50% 100%;animation:grove 9s ease-in-out infinite alternate}
@keyframes grove{from{transform:rotate(-.5deg)}to{transform:rotate(.5deg)}}
.steam{transform-box:fill-box;animation:steam 3.4s ease-out infinite;opacity:0}
.steam.b{animation-delay:-1.7s}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}30%{opacity:.85}100%{opacity:0;transform:translateY(-20px)}}
.glow{transform-box:fill-box;transform-origin:50% 50%;animation:glow 6s ease-in-out infinite alternate}
@keyframes glow{from{transform:scale(1);opacity:.7}to{transform:scale(1.12);opacity:1}}
.light{animation:light 8s ease-in-out infinite alternate}
@keyframes light{from{opacity:.5}to{opacity:1}}
.nod{transform-box:fill-box;transform-origin:50% 100%;animation:nod 5s ease-in-out infinite alternate}
.nod.b{animation-duration:6.4s;animation-delay:-2.2s}
@keyframes nod{from{transform:rotate(-1.1deg)}to{transform:rotate(1.1deg)}}
.drift{animation:drift 26s ease-in-out infinite alternate}
.drift.b{animation-duration:34s;animation-delay:-9s}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(30px)}}
.bob{animation:bob 1.05s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.breathe{transform-box:fill-box;transform-origin:50% 0;animation:breathe 7s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scaleX(1)}to{transform:scaleX(1.03)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.steam{opacity:0}}
</style>
  <title id="t">Pareja conversando en una terraza</title>
  <desc id="d">Ilustración de dos personas sentadas frente a frente en una mesa redonda, conversando con calma ante un jardín mediterráneo.</desc>
  <defs>
    <radialGradient id="sunglow"><stop offset="0" stop-color="#FFE08A" stop-opacity=".95"/><stop offset=".55" stop-color="#FFD66B" stop-opacity=".35"/><stop offset="1" stop-color="#FFD66B" stop-opacity="0"/></radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6e3"/><stop offset="1" stop-color="#f7e3b8"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cde8f0"/><stop offset="1" stop-color="#fff3d6"/></linearGradient>
    <clipPath id="arch"><path d="M300 900V400a300 300 0 0 1 600 0v500z"/></clipPath>
  </defs>
  <rect width="1200" height="900" fill="url(#wall)"/>
  <path d="M280 900V400a320 320 0 0 1 640 0v500z" fill="#fffcf5"/>
  <path d="M300 900V400a300 300 0 0 1 600 0v500z" fill="url(#sky)"/>
  <g clip-path="url(#arch)">
    <circle class="glow" cx="760" cy="230" r="130" fill="url(#sunglow)" opacity="1"/>
    <circle cx="760" cy="230" r="70" fill="#F7C65B"/>
    <g class="drift"><ellipse cx="480" cy="190" rx="56" ry="16" fill="#fff" opacity=".85"/><ellipse cx="520" cy="176" rx="34" ry="13" fill="#fff" opacity=".85"/></g>
    <g class="drift b"><ellipse cx="640" cy="320" rx="46" ry="12" fill="#fff" opacity=".7"/></g>
    <path d="M300 560C400 500 520 520 620 550S800 540 900 500V900H300z" fill="#a9d2b4"/>
    <path d="M300 640C420 590 540 620 650 646S820 630 900 600V900H300z" fill="#5ba17a"/>
    <g>
      <g transform="translate(380 560)"><rect x="-4" y="0" width="8" height="70" fill="#5a4a3c"/><ellipse cx="0" cy="-6" rx="46" ry="34" fill="#2a7550"/><ellipse cx="-24" cy="6" rx="30" ry="22" fill="#3f8c63"/><ellipse cx="26" cy="8" rx="30" ry="22" fill="#3f8c63"/></g>
      <g transform="translate(820 590)"><rect x="-4" y="0" width="8" height="60" fill="#5a4a3c"/><ellipse cx="0" cy="-6" rx="40" ry="30" fill="#123d2e"/><ellipse cx="-22" cy="6" rx="26" ry="20" fill="#2a7550"/><ellipse cx="22" cy="8" rx="26" ry="20" fill="#2a7550"/></g>
      <g transform="translate(600 610)"><rect x="-3" y="0" width="6" height="46" fill="#5a4a3c"/><ellipse cx="0" cy="-4" rx="32" ry="24" fill="#3f8c63"/></g>
    </g>
  </g>
  <path d="M300 900V400a300 300 0 0 1 600 0v500z" fill="none" stroke="#fffcf5" stroke-width="16"/>
  <!-- suelo -->
  <rect x="0" y="800" width="1200" height="100" fill="#f0d9ab"/>
  <rect x="0" y="800" width="1200" height="10" fill="#D6C7AC"/>
  <!-- persona izquierda -->
  <g class="nod">
    <rect x="418" y="560" width="36" height="60" fill="#e8b58c"/>
    <path d="M340 830C336 680 380 608 448 608S540 664 530 830z" fill="#2A7550"/>
    <circle cx="440" cy="520" r="56" fill="#f0c6a0"/>
    <path d="M384 524C380 466 420 450 452 454C488 460 504 490 496 526C488 490 456 482 424 490C404 496 390 508 384 524z" fill="#2a211c"/>
    <circle cx="398" cy="482" r="28" fill="#2a211c"/>
    <path d="M526 700C560 700 584 704 612 716" stroke="#2a7550" stroke-width="38" stroke-linecap="round" fill="none"/>
  </g>
  <!-- persona derecha -->
  <g class="nod b">
    <rect x="744" y="566" width="38" height="62" fill="#c18654"/>
    <path d="M672 830C666 690 710 616 770 616S872 668 864 830z" fill="#F4A261"/>
    <circle cx="766" cy="526" r="58" fill="#d69a6b"/>
    <path d="M708 524C706 470 744 456 774 458C812 462 826 492 822 520C808 494 770 486 742 494C724 500 712 510 708 524z" fill="#cfc8bd"/>
    <path d="M674 712C650 708 628 710 602 718" stroke="#F4A261" stroke-width="38" stroke-linecap="round" fill="none"/>
  </g>
  <!-- mesa -->
  <ellipse cx="600" cy="738" rx="150" ry="24" fill="#e3b07a"/>
  <ellipse cx="600" cy="746" rx="150" ry="24" fill="#c98e57"/>
  <ellipse cx="600" cy="736" rx="150" ry="22" fill="#ecc08a"/>
  <rect x="590" y="756" width="20" height="110" fill="#a86f3a"/>
  <ellipse cx="600" cy="868" rx="60" ry="10" fill="#a86f3a"/>
  <g class="steam"><path d="M566 690c-8-9 8-14 0-26" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></g><g class="steam b"><path d="M576 690c-8-9 8-14 0-26" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></g>
  <path d="M556 700h34l-4 30h-26z" fill="#fffcf5"/><path d="M590 708c11 0 11 12 0 12" stroke="#fffcf5" stroke-width="4" fill="none"/>
  <g class="steam b"><path d="M642 696c-8-9 8-14 0-26" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></g>
  <path d="M628 706h34l-4 30h-26z" fill="#fffcf5"/>
  <!-- maceta -->
  <g transform="translate(1010 0)">
    <path d="M-50 700h100l-14 130h-72z" fill="#e2704a"/>
    <path d="M0 700V560M0 660C-30 640-44 610-38 584M0 640C30 620 44 590 38 566M0 600C-18 584-22 562-14 544" stroke="#2a7550" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g class="sway" fill="#5ba17a"><ellipse cx="-38" cy="580" rx="14" ry="28" transform="rotate(-18 -38 580)"/><ellipse cx="38" cy="562" rx="14" ry="28" transform="rotate(20 38 562)"/><ellipse cx="-14" cy="540" rx="13" ry="26"/></g>
  </g>
</svg>
